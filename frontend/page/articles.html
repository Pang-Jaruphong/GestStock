<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
    ></script>
    <title>Articles</title>
</head>
<body>
<div class="sidebar d-flex flex-column">
    <h2 class="mb-5 text-center">Gestion de stock</h2>
    <nav class="flew-grow-1">
        <a href="dashboard.html" class="nav-link">Tableau de bord</a>
        <a href="#" class="nav-link active">Articles</a>
        <a href="orders.html" class="nav-link">Commandes</a>
        <a href="stories.html" class="nav-link">Historiques de changement</a>
        <a href="suppliers.html" class="nav-link">Fournisseurs</a>
    </nav>
    <div id="logoutBtn" class="logout-btn">Déconnexion</div>
</div>

<div class="main-content">
    <header class="d-flex justify-content-between align-items-center mb-5">
        <h1 style="color: #030444;">Articles !</h1>
    </header>
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-3">
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAddArticle">
                    Ajouter l'article</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-3">
                <button type="button" id="btnOpenList" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalSelectEdit">
                Modification d'article
                </button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-3">
                <h6 class="text-muted">Fournisseur</h6>
            </div>
        </div>
    </div>

    <div class="card-body">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Référence</th>
                <th>Nom de l'article</th>
                <th>Prix d'achat</th>
                <th>Prix de vente</th>
                <th>Stock Actuel</th>
                <th>Min Stock</th>
                <th>Fournisseur</th>
                <th>Descripstion</th>
            </tr>
            </thead>
            <tbody id="getAllArticles">
            </tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
<script>
    // help by Gemini pour guider à configuration
    // modal = backdrop or overlay to create formulaire
</script>
<div class="modal fade" id="modalAddArticle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nouvel Article</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addArticleForm">
                    <div class="mb-3">
                        <label class="form-label">Référence</label>
                        <input type="text" name="refArticle" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nom de l'article</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Prix d'achat</label>
                            <input type="number" name="buyPrice" class="form-control" step="0.05" placeholder="0.00" required>
                        </div>
                        <div class="col mb-6">
                            <label class="form-label">Prix de vente</label>
                            <input type="number" name="salePrice" class="form-control" step="0.05" placeholder="0.00" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Stock initial</label>
                            <input type="number" name="actualStock" class="form-control" step="1" min="0" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock minimum</label>
                            <input type="number" name="minStock" class="form-control" step="1">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fournisseur</label>
                        <select name="supplier_id" id="supplierSelect" class="form-select" required>
                            <option value="">-- Select --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">
                        </textarea>
                    </div>
                    <div class="modal-footer mt-4">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-primary">Enregistrer l'article</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="modalSelectEdit" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modifier l'article</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            <div class="modal-body">
                <div class="list-group" id="listEditArticles"></div>
            </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
