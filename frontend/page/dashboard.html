<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
    ></script>
    <title>Dashboard</title>
</head>
<body>
<div class="sidebar d-flex flex-column">
    <h2 class="mb-5 text-center">Gestion de stock</h2>
    <nav class="flew-grow-1">
        <a href="#" class="nav-link active">Tableau de bord</a>
        <a href="articles.html" class="nav-link">Articles</a>
        <a href="orders.html" class="nav-link">Commandes</a>
        <a href="stories.html" class="nav-link">Historiques de changement</a>
        <a href="suppliers.html" class="nav-link">Fournisseurs</a>
    </nav>
    <div id="logoutBtn" class="logout-btn">Déconnexion</div>
</div>

<div class="main-content">
    <header class="d-flex justify-content-between align-items-center mb-5">
        <h1 style="color: #030444;">Bienvenue !</h1>
    </header>
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-3">
                <h6 class="text-muted">Articles en stock</h6>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-3">
                <h6 class="text-muted">Modification</h6>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-3">
                <h6 class="text-muted">Fournisseur</h6>
            </div>
        </div>
    </div>
    <div class="card shadow-sm border-0 mt-4">
        <div class="card-header bg-white">
            <h5 class="mb-0 text-danger">⚠️ Alertes Stock (Rupture ou Critique)</h5>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Référence</th>
                    <th>Nom de l'article</th>
                    <th>Stock Actuel</th>
                    <th>Min Stock</th>
                    <th>Fournisseur</th>
                </tr>
                </thead>
                <tbody id="lowStockTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div>

</div>
<script src="../script.js"></script>
<script>
    async function loadAlerts() {
        const response = await fetch("http://localhost:5000/articles/lowStock");
        const articles = await response.json();

        // Help by Gemini : show different for sold out or few stock
        const tableBody = document.getElementById("lowStockTableBody");

        tableBody.innerHTML = articles.map(art => {
            const rowClass = art.actualStock === 0 ? 'table-danger' : 'table-warning';

            return `
            <tr class="${rowClass}">
                <td>${art.refArticle}</td>
                <td>${art.name}</td>
                <td style="text-align: center;font-weight:bold">${art.actualStock}</td>
                <td style="text-align: center">${art.minStock}</td>
                <td>${art.supplierName}</td>
            </tr>
        `;
        }).join('');
    }

    document.addEventListener("DOMContentLoaded", loadAlerts);
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'login.html';
    });

</script>
</body>
</html>
