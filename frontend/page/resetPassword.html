<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
    ></script>
    <title>Reset password</title>
</head>
<body class = "bg-light">
    <section class = "login">
        <div class = "boxForm shadow">
        <form id="formLogin" class="formLogin">
            <h2 class = "text-center mb-4">Créer votre mot de passe</h2>
            <br />

            <div class = "input-group-container">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Nouveau mot de passe" required>
                <br />
                <br/>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirmation mot de passe" required>
                <br />
                <br/>
                <button type="submit" class = "container-fluid btn btn-primary">
                    Valider
                </button>
            </div>
        </form>
        </div>
    </section>
<script>
    document.getElementById("formLogin").addEventListener("submit",async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if ( newPassword !== confirmPassword ) {
            alert("Les mots de passe ne correspondent pas !");
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        if (!token) {
            alert("Token manquant dans l'URL");
            return;
        }

        try {
            //send information to API Node.js
            const reponse = await fetch("http://localhost:5000/auth/resetPassword", {
                method : "POST",
                headers : { "Content-Type": "application/json" },
                body : JSON.stringify({
                    token: token,
                    password : newPassword}),
            });

            const data = await reponse.json();

            if (reponse.ok) {
                alert(data.message);
                window.location.href = "/login.html";
            } else {
                alert("Erreur : " + (data.message))
            }
        } catch (error) {
            alert("Erreur de connexion au serveur");
        }
    });
</script>
</body>
</html>
